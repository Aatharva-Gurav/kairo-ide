<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2b2d38" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Brand Glyph: Architectural 'K' / Editor Cursor + Code Vectors -->
  <g filter="url(#subtleGlow)">
    <!-- Vertical Pillar / Cursor -->
    <rect x="120" y="116" width="52" height="280" rx="18" fill="url(#pillarGrad)"/>

    <!-- Upper Vector (Cyan Accent) -->
    <path d="M214 260 L336 138 C345 129 359 129 368 138 C377 147 377 161 368 170 L262 276 Z" fill="url(#cyanGrad)"/>

    <!-- Lower Vector (Indigo/Violet Accent) -->
    <path d="M214 252 L336 374 C345 383 359 383 368 374 C377 365 377 351 368 342 L262 236 Z" fill="url(#indigoGrad)"/>
    
    <!-- Nexus Core Light Dot -->
    <circle cx="238" cy="256" r="10" fill="#00d8ff" opacity="0.9"/>
  </g>
</svg>

